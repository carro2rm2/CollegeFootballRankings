
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Football Top 25</title>
<style>
:root {
  --navy:#101d35;
  --gold:#e0b64f;
  --background:#f1f3f6;
  --text:#172338;
  --muted:#687589;
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;background:var(--background);
  color:var(--text);font-family:Arial,Helvetica,sans-serif
}
.page{max-width:1400px;margin:auto}
header{
  background:var(--navy);color:white;text-align:center;
  padding:17px;border-bottom:5px solid var(--gold);
  border-radius:12px;margin-bottom:14px
}
h1{margin:0;font-size:30px;letter-spacing:1px}
.subtitle{color:#d7deea;font-size:13px;margin-top:6px}
#status{text-align:center;color:var(--muted);font-size:13px;margin:12px}
.grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px
}
.card{
  min-width:0;min-height:105px;background:white;
  border:1px solid #dce1e8;border-radius:10px;
  padding:9px;display:flex;align-items:center;gap:9px;
  box-shadow:0 2px 5px #101d3510
}
.rank{flex:0 0 25px;text-align:center;color:#9b7627;
  font-size:19px;font-weight:800}
.logo{
  flex:0 0 48px;width:48px;height:48px;
  object-fit:contain
}
.fallback{
  flex:0 0 44px;width:44px;height:44px;border-radius:50%;
  background:var(--navy);color:white;display:flex;
  align-items:center;justify-content:center;
  font-size:12px;font-weight:bold
}
.info{min-width:0;flex:1}
.name{font-weight:800;font-size:14px;line-height:1.2}
.record{font-size:12px;color:var(--muted);margin-top:5px}
.rating{font-size:12px;color:#9b7627;font-weight:700;margin-top:3px}
footer{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-top:15px;padding:10px 4px;
  font-size:12px;color:var(--muted)
}
footer a{
  background:var(--navy);color:white;text-decoration:none;
  font-weight:bold;padding:10px 15px;border-radius:7px
}
@media(max-width:850px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:560px){
  body{padding:8px}
  h1{font-size:23px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .card{min-height:90px;padding:6px;gap:5px}
  .logo{flex-basis:36px;width:36px;height:36px}
  .fallback{flex-basis:34px;width:34px;height:34px}
  .name{font-size:12px}
  .rank{flex-basis:19px;font-size:16px}
}
@media print{
  @page{size:landscape;margin:.3in}
  body{padding:0;background:white}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
  .card{min-height:85px;box-shadow:none}
  footer a{color:white}
}
</style>
</head>
<body>
<div class="page">
<header>
  <h1>COLLEGE FOOTBALL TOP 25</h1>
  <div class="subtitle">Independent National Power Rankings · 2026 Season</div>
</header>

<div id="status">Loading national rankings...</div>
<main class="grid" id="rankings"></main>

<footer>
  <span>Independent College Football Power Rankings</span>
  <a href="football.html">VIEW FULL NATIONAL RANKINGS →</a>
</footer>
</div>

<iframe id="source" src="football.html"
 title="Full rankings data"
 style="position:absolute;width:1px;height:1px;left:-9999px;border:0">
</iframe>

<script>

const status = document.getElementById("status");
const frame = document.getElementById("source");

function normalize(value){
 return String(value || "").toLowerCase()
  .replace(/&/g,"and")
  .replace(/[^a-z0-9 ]/g," ")
  .replace(/\s+/g," ").trim();
}

function initials(name){
 const words=String(name).replace(/[^a-zA-Z0-9 ]/g," ")
  .trim().split(/\s+/).filter(Boolean);
 return words.length===1
  ? words[0].slice(0,3).toUpperCase()
  : words.slice(0,3).map(x=>x[0]).join("").toUpperCase();
}

function makeLogo(name){
 const wrap=document.createElement("div");
 const id=TEAM_IDS[normalize(name)];

 if(id){
  const img=document.createElement("img");
  img.className="logo";
  img.alt=name+" logo";
  img.src="https://a.espncdn.com/i/teamlogos/ncaa/500/"+id+".png";
  img.onerror=()=> {
   const fallback=document.createElement("div");
   fallback.className="fallback";
   fallback.textContent=initials(name);
   img.replaceWith(fallback);
  };
  wrap.appendChild(img);
 }else{
  const fallback=document.createElement("div");
  fallback.className="fallback";
  fallback.textContent=initials(name);
  wrap.appendChild(fallback);
 }
 return wrap;
}

function makeCard(team,index){
 const card=document.createElement("article");
 card.className="card";

 const rank=document.createElement("div");
 rank.className="rank";
 rank.textContent=index+1;

 const info=document.createElement("div");
 info.className="info";

 const name=document.createElement("div");
 name.className="name";
 name.textContent=team.name;

 const record=document.createElement("div");
 record.className="record";
 record.textContent=team.record;

 const rating=document.createElement("div");
 rating.className="rating";
 rating.textContent=team.rating ? "Power: "+team.rating : "";

 info.append(name,record,rating);
 card.append(rank,makeLogo(team.name),info);
 rankings.appendChild(card);
}

let attempts=0;

function loadRankings(){
 attempts++;
 try{
  const doc=frame.contentDocument;
  if(!doc) throw new Error("Rankings page not ready");

  const rows=[...doc.querySelectorAll("#rows tr")];
  const teams=[];

  for(const row of rows){
   const cells=row.querySelectorAll("td");
   if(cells.length<6) continue;

   const name=cells[1].textContent.trim();
   if(!name) continue;

   teams.push({
    name,
    record:cells[4].textContent.trim(),
    rating:cells[5].textContent.trim()
   });
  }

  if(teams.length<25){
   if(attempts<60){
    setTimeout(loadRankings,1000);
   }else{
    status.textContent="Rankings did not load. Check football.html.";
   }
   return;
  }

  rankings.innerHTML="";
  teams.slice(0,25).forEach(makeCard);
  status.textContent="Updated from the full national rankings.";
 }catch(error){
  if(attempts<60){
   setTimeout(loadRankings,1000);
  }else{
   status.textContent="Could not read the full rankings. Please refresh.";
  }
 }
}

frame.addEventListener("load",()=>{
 attempts=0;
 loadRankings();
});

</html>
