
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 25 College Football Rankings</title>

<style>
:root {
    --navy: #101d35;
    --gold: #e0b64f;
    --background: #f1f3f6;
    --text: #172338;
    --muted: #687589;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    max-width: 1250px;
    margin: 0 auto;
}

header {
    background: var(--navy);
    color: white;
    border-bottom: 5px solid var(--gold);
    border-radius: 12px;
    padding: 17px 22px;
    text-align: center;
    margin-bottom: 15px;
}

header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 1px;
}

.subtitle {
    color: #d7deea;
    margin-top: 6px;
    font-size: 13px;
}

#status {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin: 10px 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
}

.team-card {
    min-width: 0;
    min-height: 112px;
    background: white;
    border: 1px solid #dce1e8;
    border-radius: 10px;
    padding: 10px 8px;
    display: flex;
    align-items: center;
    gap: 9px;
    box-shadow: 0 2px 5px rgba(16, 29, 53, 0.06);
}

.rank {
    flex: 0 0 25px;
    color: #9b7627;
    font-size: 19px;
    font-weight: 800;
    text-align: center;
}

.logo-wrap {
    flex: 0 0 52px;
    width: 52px;
    height: 52px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.team-logo {
    max-width: 52px;
    max-height: 52px;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.logo-fallback {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--navy);
    color: white;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
}

.team-info {
    min-width: 0;
    flex: 1;
}

.team-name {
    font-weight: 800;
    font-size: 14px;
    line-height: 1.2;
    overflow-wrap: anywhere;
}

.team-record {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.team-rating {
    color: #9b7627;
    font-size: 12px;
    font-weight: 700;
    margin-top: 3px;
}

footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 15px;
    padding: 12px 4px;
    font-size: 12px;
    color: var(--muted);
}

footer a {
    background: var(--navy);
    color: white;
    text-decoration: none;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 7px;
}

footer a:hover {
    background: #263d61;
}

@media (max-width: 850px) {
    body {
        padding: 10px;
    }

    .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 560px) {
    header h1 {
        font-size: 23px;
    }

    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
    }

    .team-card {
        min-height: 95px;
        padding: 7px 5px;
        gap: 5px;
    }

    .rank {
        flex-basis: 20px;
        font-size: 16px;
    }

    .logo-wrap {
        flex-basis: 38px;
        width: 38px;
        height: 38px;
    }

    .team-logo {
        max-width: 38px;
        max-height: 38px;
    }

    .logo-fallback {
        width: 36px;
        height: 36px;
    }

    .team-name {
        font-size: 12px;
    }
}

@media print {
    @page {
        size: landscape;
        margin: 0.3in;
    }

    body {
        padding: 0;
        background: white;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }

    .page {
        max-width: none;
    }

    header {
        margin-bottom: 10px;
        padding: 12px;
    }

    header h1 {
        font-size: 25px;
    }

    .grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 7px;
    }

    .team-card {
        min-height: 90px;
        box-shadow: none;
    }

    footer a {
        color: white !important;
    }
}
</style>
</head>

<body>
<div class="page">

    <header>
        <h1>COLLEGE FOOTBALL TOP 25</h1>
        <div class="subtitle">National Power Rankings • 2026 Season</div>
    </header>

    <div id="status">Loading national rankings and team logos...</div>

    <main class="grid" id="rankings"></main>

    <footer>
        <span>Independent College Football Power Rankings</span>
        <a href="football.html">VIEW FULL NATIONAL RANKINGS →</a>
    </footer>

</div>

<!-- Loads the full rankings page in the background -->
<iframe
    id="rankingsFrame"
    src="football.html"
    title="Full rankings data"
    style="position:absolute;width:1px;height:1px;left:-9999px;border:0;">
</iframe>

<script>
const ESPN_TEAMS_URL =
    "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams?limit=500";

const rankingsContainer = document.getElementById("rankings");
const statusElement = document.getElementById("status");
const frame = document.getElementById("rankingsFrame");

let rankingsLoaded = false;
let logoMap = new Map();

function normalize(name) {
    return String(name || "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]/g, "");
}

function getInitials(name) {
    const words = String(name || "")
        .replace(/[^a-zA-Z0-9 ]/g, "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if (words.length === 1) {
        return words[0].slice(0, 3).toUpperCase();
    }

    return words.slice(0, 3)
        .map(word => word[0])
        .join("")
        .toUpperCase();
}

/* Some ranking names differ from ESPN's team display names. */
const aliases = {
    "miamioh": "miamiohio",
    "miamifl": "miamiflorida",
    "olemiss": "mississippi",
    "lsu": "louisianastate",
    "usc": "southerncalifornia",
    "ucf": "centralflorida",
    "smu": "southernmethodist",
    "tcu": "texaschristian",
    "byu": "brighamyoung",
    "utsa": "texassanantonio",
    "unlv": "nevada las vegas",
    "appstate": "appalachianstate",
    "ncstate": "northcarolinastate",
    "pitt": "pittsburgh",
    "olemissrebels": "mississippi",
    "uconn": "connecticut",
    "umass": "massachusetts"
};

function findLogo(teamName) {
    const key = normalize(teamName);
    const lookup = aliases[key] || key;

    if (logoMap.has(lookup)) {
        return logoMap.get(lookup);
    }

    /* Try partial matching if exact matching fails. */
    for (const [espnName, logo] of logoMap.entries()) {
        if (
            espnName.length > 4 &&
            (espnName.includes(lookup) || lookup.includes(espnName))
        ) {
            return logo;
        }
    }

    return null;
}

async function loadEspnLogos() {
    try {
        const response = await fetch(ESPN_TEAMS_URL);

        if (!response.ok) {
            throw new Error("ESPN response was not successful");
        }

        const data = await response.json();

        const entries =
            data?.sports?.[0]?.leagues?.[0]?.teams || [];

        for (const entry of entries) {
            const team = entry.team || entry;

            if (!team.displayName && !team.name) {
                continue;
            }

            const names = [
                team.displayName,
                team.shortDisplayName,
                team.name,
                team.abbreviation
            ].filter(Boolean);

            const logo =
                team.logos?.[0]?.href ||
                team.logos?.[0]?.url;

            if (!logo) {
                continue;
            }

            for (const name of names) {
                logoMap.set(normalize(name), logo);
            }
        }

        return true;

    } catch (error) {
        console.warn("Could not load ESPN logos:", error);
        return false;
    }
}

function showLogo(teamName, logoUrl) {
    const wrap = document.createElement("div");
    wrap.className = "logo-wrap";

    const fallback = document.createElement("div");
    fallback.className = "logo-fallback";
    fallback.textContent = getInitials(teamName);

    if (logoUrl) {
        const img = document.createElement("img");
        img.className = "team-logo";
        img.src = logoUrl;
        img.alt = teamName + " logo";
        img.loading = "eager";

        img.onerror = function () {
            img.style.display = "none";
            fallback.style.display = "flex";
        };

        wrap.appendChild(img);
    } else {
        fallback.style.display = "flex";
    }

    wrap.appendChild(fallback);
    return wrap;
}

function createCard(team, index) {
    const card = document.createElement("div");
    card.className = "team-card";

    const rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = index + 1;

    const logo = showLogo(team.name, findLogo(team.name));

    const info = document.createElement("div");
    info.className = "team-info";

    const name = document.createElement("div");
    name.className = "team-name";
    name.textContent = team.name;

    const record = document.createElement("div");
    record.className = "team-record";
    record.textContent = team.record || "Record unavailable";

    const rating = document.createElement("div");
    rating.className = "team-rating";
    rating.textContent = team.rating
        ? "Power: " + team.rating
        : "";

    info.appendChild(name);
    info.appendChild(record);
    info.appendChild(rating);

    card.appendChild(rank);
    card.appendChild(logo);
    card.appendChild(info);

    return card;
}

/*
 * Reads the actual rankings table from football.html.
 * Expected columns:
 * 1 = Team
 * 4 = Record
 * 5 = Power Rating
 */
function readRankings() {
    try {
        const doc = frame.contentDocument;

        if (!doc || !doc.body) {
            return false;
        }

        let rowsContainer = doc.querySelector("#rows");

        if (!rowsContainer) {
            rowsContainer = doc.querySelector("table tbody");
        }

        if (!rowsContainer) {
            return false;
        }

        const rows = Array.from(
            rowsContainer.querySelectorAll("tr")
        );

        const teams = [];

        for (const row of rows) {
            const cells = Array.from(row.querySelectorAll("td"));

            if (cells.length < 6) {
                continue;
            }

            const teamName = cells[1].innerText.trim();

            if (!teamName) {
                continue;
            }

            teams.push({
                name: teamName,
                record: cells[4].innerText.trim(),
                rating: cells[5].innerText.trim()
            });
        }

        if (teams.length < 25) {
            return false;
        }

        rankingsContainer.innerHTML = "";

        teams.slice(0, 25).forEach((team, index) => {
            rankingsContainer.appendChild(
                createCard(team, index)
            );
        });

        rankingsLoaded = true;
        statusElement.textContent =
            "Rankings loaded • Top 25 teams";

        return true;

    } catch (error) {
        console.warn("Waiting for rankings table:", error);
        return false;
    }
}

async function startPage() {
    /* Start loading logos while the rankings page loads. */
    const logoPromise = loadEspnLogos();

    let attempts = 0;
    const maxAttempts = 60;

    const timer = setInterval(async () => {
        attempts++;

        if (readRankings()) {
            clearInterval(timer);

            await logoPromise;

            /* Rebuild cards now that logo data is available. */
            readRankings();
            return;
        }

        if (attempts >= maxAttempts) {
            clearInterval(timer);

            statusElement.textContent =
                "Unable to read the rankings table. Please refresh or check the full rankings page.";

            console.error(
                "Could not find enough ranking rows in football.html."
            );
        }
    }, 1000);
}

frame.addEventListener("load", startPage);

/* Also start if the iframe already loaded. */
if (frame.contentDocument?.readyState === "complete") {
    startPage();
}
</script>

</body>
</html>
